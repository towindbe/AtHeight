name = "atheight-proxy"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Namespace anlegen mit:  npx wrangler kv namespace create TOKENS
# und die ausgegebene id hier eintragen.
[[kv_namespaces]]
binding = "TOKENS"
id = "13608f63af6c410bbd8e78ce068749aa"

# Zähler der Abfragen je Token und Tag
[[d1_databases]]
binding = "ZAEHLER"
database_name = "atheight-zaehler"
database_id = "88d3f8b6-709e-4d7e-bfc7-ec79971d5aa1"

[vars]
# Leer = kostenloser Endpunkt. Nach Buchung des Plans: "customer-"
OM_PREFIX = ""
# Standard-Tageslimit je Token, falls im Token nichts steht
STANDARD_LIMIT = "2000"
# Adresse der App (für die Links in der Admin-Seite; bei Umzug des Repos hier ändern)
APP_URL = "https://towindbe.github.io/AtHeight/windbericht.html"
# Secrets (nicht im Repo): npx wrangler secret put ADMIN_KEY   und   npx wrangler secret put OM_KEY
# Der API-Key kommt als Secret:  npx wrangler secret put OM_KEY
